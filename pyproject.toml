[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-prompt-radar"
version = "0.1.0"
description = "A GitHub Action and CLI that detects risky changes to LLM prompts and AI configuration before they ship to production"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Tahiram32", email = "tahiramuhammad53@gmail.com"}]
keywords = ["llm", "prompt", "ai", "github-action", "ci", "safety", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Tahiram32/llm-prompt-radar"
Repository = "https://github.com/Tahiram32/llm-prompt-radar"
Issues = "https://github.com/Tahiram32/llm-prompt-radar/issues"

[project.scripts]
llm-prompt-radar = "llm_prompt_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
